<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Mantenimiento de equipos - Microservicios</text>

  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#374151">Cliente (Postman / frontend)</text>
  <rect x="360" y="70" width="180" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="450" y="92" text-anchor="middle" font-size="13" fill="#111827">HTTP REST + JSON</text>
  <line x1="450" y1="104" x2="150" y2="150" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="450" y1="104" x2="450" y2="150" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="450" y1="104" x2="750" y2="150" stroke="#6b7280" stroke-width="1.5"/>

  <rect x="40" y="150" width="220" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">cliente-service</text>
  <text x="150" y="196" text-anchor="middle" font-size="12" fill="#1e3a8a">puerto 8081</text>
  <text x="150" y="220" text-anchor="middle" font-size="12" fill="#1e3a8a">CRUD de clientes</text>
  <text x="150" y="238" text-anchor="middle" font-size="12" fill="#1e3a8a">/api/clientes</text>
  <text x="150" y="262" text-anchor="middle" font-size="11" fill="#1e3a8a">documento unico</text>

  <rect x="340" y="150" width="220" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">equipo-service</text>
  <text x="450" y="196" text-anchor="middle" font-size="12" fill="#14532d">puerto 8082</text>
  <text x="450" y="220" text-anchor="middle" font-size="12" fill="#14532d">CRUD de equipos</text>
  <text x="450" y="238" text-anchor="middle" font-size="12" fill="#14532d">/api/equipos</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#14532d">codigo unico, idCliente</text>

  <rect x="640" y="150" width="220" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="750" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">orden-servicio-service</text>
  <text x="750" y="196" text-anchor="middle" font-size="12" fill="#78350f">puerto 8083</text>
  <text x="750" y="220" text-anchor="middle" font-size="12" fill="#78350f">CRUD de ordenes + estado</text>
  <text x="750" y="238" text-anchor="middle" font-size="12" fill="#78350f">/api/ordenes-servicio</text>
  <text x="750" y="262" text-anchor="middle" font-size="11" fill="#78350f">idEquipo, RECIBIDO..ENTREGADO</text>

  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs>
  <line x1="340" y1="215" x2="262" y2="215" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="301" y="207" text-anchor="middle" font-size="10" fill="#374151">GET /{id}</text>
  <line x1="640" y1="215" x2="562" y2="215" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="601" y="207" text-anchor="middle" font-size="10" fill="#374151">GET /{id}</text>

  <line x1="150" y1="280" x2="150" y2="330" stroke="#374151" stroke-width="1.5"/>
  <line x1="450" y1="280" x2="450" y2="330" stroke="#374151" stroke-width="1.5"/>
  <line x1="750" y1="280" x2="750" y2="330" stroke="#374151" stroke-width="1.5"/>

  <g fill="#f3f4f6" stroke="#374151" stroke-width="1.5">
    <rect x="70" y="330" width="160" height="50" rx="8"/>
    <rect x="370" y="330" width="160" height="50" rx="8"/>
    <rect x="670" y="330" width="160" height="50" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#111827">
    <text x="150" y="352" font-weight="bold">MySQL</text><text x="150" y="370">bd_cliente</text>
    <text x="450" y="352" font-weight="bold">MySQL</text><text x="450" y="370">bd_equipo</text>
    <text x="750" y="352" font-weight="bold">MySQL</text><text x="750" y="370">bd_orden_servicio</text>
  </g>
  <text x="450" y="415" text-anchor="middle" font-size="12" fill="#6b7280">Cada servicio tiene su propia BD; las referencias entre servicios son solo IDs (sin FK entre bases).</text>
</svg>
