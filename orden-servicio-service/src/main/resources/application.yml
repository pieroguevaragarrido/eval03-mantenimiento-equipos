# ============================================================
# orden-servicio-service  |  Evaluacion 03 - Mantenimiento de equipos
# Perfil activo por defecto: dev  (cambiar con PROFILE_ACTIVE=prod)
# ============================================================
spring:
  application:
    name: orden-servicio-service
  profiles:
    active: ${PROFILE_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

servicios:
  validar-referencias: true
  equipo:
    url: http://localhost:8082

---
# ---------------------------- DEV ----------------------------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/bd_orden_servicio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 8083
logging:
  level:
    root: INFO
    com.tecsup.orden: DEBUG

---
# ---------------------------- PROD ---------------------------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_orden_servicio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
server:
  port: ${SERVER_PORT:8083}
logging:
  level:
    root: WARN
    com.tecsup.orden: INFO

servicios:
  validar-referencias: true
  equipo:
    url: ${EQUIPO_SERVICE_URL:http://localhost:8082}

